name: Verify frontend and Workers

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: NEXT_STATIC_EXPORT=1 npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
