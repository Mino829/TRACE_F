name: Deploy production to Cloudflare

on:
  workflow_run:
    workflows: [Verify frontend and Workers]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Explicit commit SHA, branch, or tag to validate/deploy
        required: true
        type: string
      deploy:
        description: Publish trace-production after validation (false only validates)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      - name: Confirm selected commit
        env:
          VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          selected_sha="$(git rev-parse HEAD)"
          if [ -n "$VERIFIED_SHA" ] && [ "$selected_sha" != "$VERIFIED_SHA" ]; then
            echo 'Checkout does not match the commit selected for this workflow run.' >&2
            exit 1
          fi
          printf 'Selected production commit: %s\n' "$selected_sha"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            push-worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: push-worker
      - name: Build isolated production snapshot without credentials
        run: npm run build:production -- --config "$GITHUB_WORKSPACE/push-worker/production.public.json"
      - name: Validate existing production account and Edge binding (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix push-worker run validate:production -- --config "$GITHUB_WORKSPACE/push-worker/production.public.json"
      - name: Deploy only trace-production
        if: github.event_name == 'workflow_run' || inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix push-worker run deploy:production -- --config "$GITHUB_WORKSPACE/push-worker/production.public.json"
