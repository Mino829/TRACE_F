name: Deploy to Cloudflare

# Runs push-worker's release (D1 migrations, trace-push, static export, trace-log)
# after "Verify frontend and Workers" passes on a push to main.
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional repository variables, written to push-worker/.env only when set:
# PUSH_API_URL, TRACE_API_URL, ARRIVAL_VENUE, ARRIVAL_CHECKPOINT_ID,
# DISPLAY_API_URL, GOOGLE_CLIENT_ID, ARRIVAL_ISSUER_URL.

on:
  workflow_run:
    workflows: [Verify frontend and Workers]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            push-worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: push-worker
      - name: Write push-worker/.env
        working-directory: push-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          TRACE_API_URL: ${{ vars.TRACE_API_URL }}
          ARRIVAL_VENUE: ${{ vars.ARRIVAL_VENUE }}
          ARRIVAL_CHECKPOINT_ID: ${{ vars.ARRIVAL_CHECKPOINT_ID }}
          DISPLAY_API_URL: ${{ vars.DISPLAY_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ARRIVAL_ISSUER_URL: ${{ vars.ARRIVAL_ISSUER_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUSH_API_URL TRACE_API_URL ARRIVAL_VENUE ARRIVAL_CHECKPOINT_ID DISPLAY_API_URL GOOGLE_CLIENT_ID ARRIVAL_ISSUER_URL; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> .env; fi
          done
      - run: npm run release
        working-directory: push-worker
